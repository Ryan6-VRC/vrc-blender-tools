schema_version = "1.0.0"

id = "avatarprep"
version = "1.1.0"
name = "AvatarPrep"
tagline = "VRChat avatar prep: apply pose as rest, export Unity FBX"
maintainer = "Ryan6-VRC <236273965+Ryan6-VRC@users.noreply.github.com>"
type = "add-on"

# Minimum Blender version. NO upper cap on purpose (CATS' upper-version guard
# was its downfall on Blender 5.1+).
blender_version_min = "5.1.0"

license = [
  "SPDX:MIT",
]

tags = ["Rigging", "Mesh", "Import-Export"]

# Weight transfer (core/weight_transfer.py) imports these. The files are not committed:
# tools/provision_deps.py downloads them into wheels/ beside this manifest, and its
# PINS move together with this list.
platforms = ["windows-x64"]
wheels = [
  "./wheels/scipy-1.18.1-cp313-cp313-win_amd64.whl",
  "./wheels/robust_laplacian-1.0.0-cp313-cp313-win_amd64.whl",
]

[permissions]
files = "Export FBX files to disk for Unity/VRChat import"
